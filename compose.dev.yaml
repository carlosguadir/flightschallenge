# Run with: podman compose --in-pod=false -f compose.yaml -f compose.dev.yaml up
# podman-compose creates a pod by default; userns_mode keep-id cannot be combined with it.
services:
  backend:
    build:
      target: development
    userns_mode: keep-id
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://flight:flight@db:5432/flight
      LOG_LEVEL: debug
      LOG_PRETTY: 'true'
      THROTTLE_ENABLED: 'false'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app:Z
      - backend_node_modules:/app/node_modules
    ports:
      - '3000:3000'
    command: ['npm', 'run', 'start:dev', '--workspace', '@flight/backend']

  frontend:
    build:
      target: development
    userns_mode: keep-id
    environment:
      VITE_BACKEND_URL: http://backend:3000
      VITE_USE_POLLING: 'true'
    volumes:
      - .:/app:Z
      - frontend_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    command:
      - npm
      - run
      - dev
      - --workspace
      - '@flight/frontend'
      - --
      - --host
      - 0.0.0.0

volumes:
  backend_node_modules:
  frontend_node_modules:
