services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flight
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro,Z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flight -d flight']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Containerfile
      target: runtime
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: '3000'
      DATABASE_URL: postgres://flight:flight@db:5432/flight
      COOKIE_SECRET: local-cookie-secret-change-me
      COOKIE_SECURE: 'false'
      TRUST_PROXY: '1'
      SEAT_HOLD_TTL_SECONDS: ${SEAT_HOLD_TTL_SECONDS:-300}
      MAX_HOLDS_PER_FLIGHT: '4'
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-300}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      LOCK_TIMEOUT_MS: '2000'
      STATEMENT_TIMEOUT_MS: '10000'
      THROTTLE_ENABLED: ${THROTTLE_ENABLED:-true}
      THROTTLE_LIMIT: '100'
      THROTTLE_TTL_SECONDS: '60'
      METRICS_BATCH_MS: ${METRICS_BATCH_MS:-75}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
      APP_VERSION: dev
      TEST_RESET_TOKEN: ${TEST_RESET_TOKEN:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Containerfile
      target: runtime
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  e2e:
    profiles: ['e2e']
    build:
      context: .
      dockerfile: e2e/Containerfile
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend
      TEST_RESET_TOKEN: ${TEST_RESET_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    shm_size: '1g'

  tests:
    profiles: ['test']
    build:
      context: .
      dockerfile: backend/Containerfile
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://flight:flight@db:5432/app_test
      COOKIE_SECRET: test-cookie-secret
      COOKIE_SECURE: 'false'
      TRUST_PROXY: '0'
      SEAT_HOLD_TTL_SECONDS: '300'
      MAX_HOLDS_PER_FLIGHT: '4'
      PAYMENT_DELAY_MS: '0'
      PG_POOL_MAX: '20'
      LOCK_TIMEOUT_MS: '2000'
      STATEMENT_TIMEOUT_MS: '10000'
      THROTTLE_ENABLED: 'false'
      THROTTLE_LIMIT: '100'
      THROTTLE_TTL_SECONDS: '60'
      METRICS_BATCH_MS: '25'
      LOG_LEVEL: silent
      LOG_PRETTY: 'false'
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'test:integration']

volumes:
  db-data:
